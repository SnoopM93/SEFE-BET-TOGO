<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEFE BET TOGO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#091a0b;color:#fff}
.header{background:#0a3d12;padding:14px;text-align:center;font-weight:900;font-size:15px}
.championnats{display:flex;gap:8px;overflow-x:auto;padding:12px;background:#091a0b}
.champ{background:#1a2e1a;border:1.5px solid #2d5a2d;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.champ.active{background:#00a651;border-color:#00a651;color:#fff}
.ticket{background:#fff;color:#000;margin:12px;border-radius:14px;overflow:hidden}
.bundes{background:#0b3d91;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;font-weight:800;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px}
.team{flex:1;text-align:center}
.logo{width:68px;height:68px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;border:3px solid #ddd;background:#fff}
.name{font-size:10px;font-weight:800;margin-top:6px;line-height:1.1;text-transform:uppercase}
.mid{text-align:center;flex:1}
.label{font-size:10px;font-weight:800}
.score{background:#1d5bff;color:#fff;font-size:32px;font-weight:900;padding:7px 18px;border-radius:10px;display:inline-block;margin-top:5px}
.opts{display:flex;gap:8px;padding:10px;background:#f8fafc}
.opt{flex:1;background:#fff;border:1.5px solid #c7e8c7;border-radius:10px;overflow:hidden;text-align:center}
.opt-h{background:#00a651;color:#fff;font-size:8.5px;font-weight:800;padding:7px}
.opt-b{font-size:36px;font-weight:900;color:#00a651;padding-top:6px}
.opt-s{font-size:8.5px;font-weight:700;padding-bottom:7px}
</style>
</head>
<body>

<div class="header">SEFE BET TOGO • GRATUIT</div>

<div class="championnats">
  <div class="champ active" onclick="filtrer('ALL', this)">TOUS</div>
  <div class="champ" onclick="filtrer('BUNDESLIGA', this)">BUNDESLIGA</div>
  <div class="champ" onclick="filtrer('LIGA2', this)">LIGA2</div>
  <div class="champ" onclick="filtrer('PREMIER', this)">PREMIER LEAGUE</div>
</div>

<div id="coeur"></div>

<script>
// ✅ DONNÉES EN DUR - PAS D'API, PAS DE RANDOM, PAS DE BUG
const MATCHS = [
  { champ: "LIGA2", home: "RACING SANTANDER", away: "ESPANYOL", score: "1-2" },
  { champ: "BUNDESLIGA", home: "MAINZ 05", away: "WERDER BREME", score: "1-2" },
  { champ: "PREMIER", home: "ARSENAL", away: "CHELSEA", score: "1-2" },
  { champ: "LIGA2", home: "LEVANTE", away: "VILLARREAL B", score: "2-1" },
  { champ: "BUNDESLIGA", home: "BAYERN", away: "DORTMUND", score: "1-2" }
];

let current = "ALL";

function afficher(){
  let html = "";
  let count = 0;
  MATCHS.forEach(m => {
    if(current !== "ALL" && m.champ !== current) return;
    count++;
    html += `
    <div class="ticket">
      <div class="bundes"><span>${m.champ}</span><span>SAM. 24 OCT. 2026</span></div>
      <div class="top">
        <div class="team"><div class="logo">${m.home[0]}</div><div class="name">${m.home}</div></div>
        <div class="mid"><div class="label">SCORE EXACT</div><div class="score">${m.score}</div></div>
        <div class="team"><div class="logo" style="background:#16a34a;color:#fff">${m.away[0]}</div><div class="name">${m.away}</div></div>
      </div>
      <div class="opts">
        <div class="opt"><div class="opt-h">PLUS DE 1,5 BUT</div><div class="opt-b">+1,5</div><div class="opt-s">PLUS DE 1,5 BUT</div></div>
        <div class="opt"><div class="opt-h">LES DEUX ÉQUIPES MARQUENT</div><div class="opt-b">GG</div><div class="opt-s">OUI</div></div>
      </div>
    </div>`;
  });
  document.getElementById('coeur').innerHTML = html;
}

function filtrer(champ, el){
  current = champ;
  document.querySelectorAll('.champ').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  afficher();
}

afficher();
</script>

</body>
</html>
