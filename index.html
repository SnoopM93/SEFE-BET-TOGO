<!DOCTYPE html>
<html><head>
<script src="cerveau.js"></script>
<script src="yeux.js"></script>
<script src="ia.js"></script>
</head>
<body>
<div id="coeur"></div>
<script>
  // Le cœur bat: il appelle le cerveau et les yeux
  async function battementCoeur(){
    let dataYeux = await YEUX.voir("Man City");
    let calculCerveau = CERVEAU.mathematique(3,4,1.6,2.1,{dom:1,ext:0});
    let decisionIA = IA.decider(calculCerveau, dataYeux);
    document.getElementById('coeur').innerHTML = decisionIA;
  }
  battementCoeur();
</script>
</body></html>
